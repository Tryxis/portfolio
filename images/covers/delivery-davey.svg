<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#20232a"/>
    </pattern>
  </defs>
  <rect width="400" height="250" fill="#0f1013"/>
  <rect width="400" height="250" fill="url(#grid)"/>

  <!-- motion lines -->
  <g stroke="#c4453a" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <line x1="90" y1="108" x2="130" y2="108"/>
    <line x1="80" y1="125" x2="130" y2="125"/>
    <line x1="95" y1="142" x2="130" y2="142"/>
  </g>

  <!-- parcel -->
  <g transform="translate(155,85)">
    <rect x="0" y="20" width="90" height="70" rx="3" fill="none" stroke="#e9e6e0" stroke-width="2.5"/>
    <path d="M0 40 L90 40" stroke="#c4453a" stroke-width="4"/>
    <path d="M45 20 L45 90" stroke="#c4453a" stroke-width="4"/>
    <path d="M0 20 L45 2 L90 20" fill="none" stroke="#e9e6e0" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>

<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#20232a"/>
    </pattern>
  </defs>
  <rect width="400" height="250" fill="#0f1013"/>
  <rect width="400" height="250" fill="url(#grid)"/>

  <!-- column headers -->
  <g stroke-width="3" stroke-linecap="round">
    <line x1="92" y1="62" x2="132" y2="62" stroke="#5f636b"/>
    <line x1="180" y1="62" x2="220" y2="62" stroke="#c4453a"/>
    <line x1="268" y1="62" x2="308" y2="62" stroke="#e9e6e0"/>
  </g>

  <!-- backlog column -->
  <g fill="#0f1013" stroke="#5f636b" stroke-width="2" stroke-linejoin="round">
    <rect x="88" y="80" width="48" height="30" rx="3"/>
    <rect x="88" y="118" width="48" height="30" rx="3"/>
    <rect x="88" y="156" width="48" height="30" rx="3"/>
  </g>

  <!-- playing column -->
  <g fill="#0f1013" stroke-width="2" stroke-linejoin="round">
    <rect x="176" y="80" width="48" height="30" rx="3" stroke="#c4453a" fill="#c4453a"/>
    <rect x="176" y="118" width="48" height="30" rx="3" stroke="#e9e6e0"/>
  </g>

  <!-- completed column -->
  <g fill="#0f1013" stroke="#e9e6e0" stroke-width="2" stroke-linejoin="round">
    <rect x="264" y="80" width="48" height="30" rx="3"/>
  </g>
  <path d="M280 96 L286 102 L297 90" fill="none" stroke="#c4453a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

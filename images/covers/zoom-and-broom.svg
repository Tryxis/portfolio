<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#20232a"/>
    </pattern>
  </defs>
  <rect width="400" height="250" fill="#0f1013"/>
  <rect width="400" height="250" fill="url(#grid)"/>

  <!-- speed streaks -->
  <g stroke="#c4453a" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
    <line x1="55" y1="110" x2="105" y2="110"/>
    <line x1="45" y1="128" x2="110" y2="128"/>
    <line x1="60" y1="146" x2="105" y2="146"/>
  </g>

  <!-- car body -->
  <g stroke="#e9e6e0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M120 155
             L133 155
             L150 122
             C158 110 172 103 186 103
             L232 103
             C245 103 257 110 264 121
             L282 155
             L295 155" />
    <path d="M133 155 L295 155" />
    <line x1="164" y1="122" x2="252" y2="122"/>
  </g>

  <!-- window divider -->
  <line x1="196" y1="103" x2="192" y2="122" stroke="#c4453a" stroke-width="2.5"/>

  <!-- wheels -->
  <circle cx="152" cy="158" r="14" fill="#0f1013" stroke="#e9e6e0" stroke-width="3"/>
  <circle cx="152" cy="158" r="4" fill="#c4453a"/>
  <circle cx="266" cy="158" r="14" fill="#0f1013" stroke="#e9e6e0" stroke-width="3"/>
  <circle cx="266" cy="158" r="4" fill="#c4453a"/>
</svg>

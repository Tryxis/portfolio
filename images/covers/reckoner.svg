<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reckoner cover art">
  <defs>
    <pattern id="grid-reck" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#20232a"/>
    </pattern>
  </defs>
  <rect width="400" height="250" fill="#0f1013"/>
  <rect width="400" height="250" fill="url(#grid-reck)"/>

  <!-- probability distribution: the app's own output, as the motif -->
  <g>
    <rect x="86"  y="150" width="26" height="30"  fill="#2a2e35"/>
    <rect x="120" y="126" width="26" height="54"  fill="#3a3f47"/>
    <rect x="154" y="96"  width="26" height="84"  fill="#6e7480"/>
    <rect x="188" y="78"  width="26" height="102" fill="#c4453a"/>
    <rect x="222" y="104" width="26" height="76"  fill="#6e7480"/>
    <rect x="256" y="138" width="26" height="42"  fill="#3a3f47"/>
    <rect x="290" y="160" width="26" height="20"  fill="#2a2e35"/>
  </g>
  <line x1="78" y1="180" x2="324" y2="180" stroke="#3a3f47" stroke-width="2"/>

  <!-- axis ticks: models slain -->
  <g font-family="monospace" font-size="11" fill="#5f636b" text-anchor="middle">
    <text x="99"  y="196">0</text>
    <text x="133" y="196">1</text>
    <text x="167" y="196">2</text>
    <text x="201" y="196">3</text>
    <text x="235" y="196">4</text>
    <text x="269" y="196">5</text>
    <text x="303" y="196">6</text>
  </g>

  <!-- roll targets -->
  <g font-family="monospace" font-size="15" fill="#e9e6e0">
    <text x="82" y="54">3+</text>
    <text x="130" y="54">3+</text>
    <text x="178" y="54">5+</text>
  </g>
  <g font-family="monospace" font-size="9" fill="#5f636b">
    <text x="82" y="66">HIT</text>
    <text x="130" y="66">WND</text>
    <text x="178" y="66">SAVE</text>
  </g>
  <text x="318" y="54" text-anchor="end" font-family="monospace" font-size="15" fill="#c4453a" font-weight="700">2.9</text>
  <text x="318" y="66" text-anchor="end" font-family="monospace" font-size="9" fill="#5f636b">SLAIN</text>

  <text x="200" y="228" text-anchor="middle" font-family="monospace" font-size="13" fill="#5f636b" letter-spacing="3">EXPECTED DAMAGE</text>
</svg>
